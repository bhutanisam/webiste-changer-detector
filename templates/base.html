<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Change Detector</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f7; color: #222; }
    header { background: #222; padding: 14px 24px; }
    header a { color: white; text-decoration: none; font-weight: bold; font-size: 18px; }
    main { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    input, select, button { padding: 7px; margin: 3px 0; font-size: 14px; }
    input[type=text], input[type=url], input[type=email] { width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    .badge { padding: 2px 8px; border-radius: 10px; color: white; font-size: 12px; }
    .ok { background: #2e9e4f; } .error { background: #d33; }
    .blocked { background: #e08a00; } .noisy { background: #8a4fd3; } .pending { background: #888; }
    .msg-ok { background: #e3f6e8; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .msg-error { background: #fde4e4; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    img { max-width: 100%; border: 1px solid #ccc; }
    small { color: #666; }
    /* styles for the difflib side-by-side table */
    table.diff { font-family: monospace; font-size: 12px; }
    .diff_header { background: #e0e0e0; }
    td.diff_header { text-align: right; }
    .diff_next { background: #c0c0c0; }
    .diff_add { background: #aaffaa; }
    .diff_chg { background: #ffff77; }
    .diff_sub { background: #ffaaaa; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">Website Change Detector</a></header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="msg-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
